startup:
  banner: "Vertex is running: observation, evidence and private alerts. No automatic punishments."
  platform: "Detected platform: <platform> (Minecraft <minecraft>, Java <java>)."
  packets: "Packet observation: <state>."
  messaging: "Rich messaging: <state>."
  metrics: "TPS/MSPT: <state>."
  limited: "Capability unavailable: <what>. Dependent checks stay inactive."
  shutdown: "Vertex stopped."
