name: Probe
on:
  workflow_dispatch:
  push:
    branches: [ "claude/vertex-minecraft-anticheat-5ldbyr" ]
    paths: [ ".github/workflows/probe.yml" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Probe bukkit-only artifact and misc
        run: |
          set +e
          mkdir -p out
          {
          R=https://hub.spigotmc.org/nexus/content/repositories/snapshots
          for a in org/bukkit/bukkit org/bukkit/craftbukkit org/spigotmc/spigot; do echo "== $a"; curl -sSL -m 30 $R/$a/maven-metadata.xml | grep -E "<latest>|<version>26|<release>" | head -10; done
          mkdir -p w/b && cd w/b
          cat > pom.xml <<POM
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>p</groupId><artifactId>b</artifactId><version>1</version>
          <repositories><repository><id>r</id><url>$R/</url></repository></repositories>
          <dependencies><dependency><groupId>org.bukkit</groupId><artifactId>bukkit</artifactId><version>26.1-R0.1-SNAPSHOT</version></dependency></dependencies></project>
          POM
          mvn -q -B dependency:copy-dependencies -DoutputDirectory=lib 2>&1 | tail -5; ls lib
          CP=$(ls lib/*.jar | tr '\n' ':')
          for c in org.bukkit.entity.Player 'org.bukkit.entity.Player$Spigot' org.bukkit.Server 'org.bukkit.Server$Spigot' org.bukkit.scoreboard.Team; do echo "#### $c"; javap -public -cp "$CP" $c 2>&1 | grep -E "spigot\(|getPing|Spigot|getTPS|getPrefix|prefix|class |interface " | head; done
          cd ../..
          } > out/misc.txt 2>&1
          mkdir -p w/s && cd w/s
          R=https://hub.spigotmc.org/nexus/content/repositories/snapshots
          cat > pom.xml <<POM
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>p</groupId><artifactId>s</artifactId><version>1</version>
          <repositories><repository><id>r</id><url>$R/</url></repository></repositories>
          <dependencies><dependency><groupId>org.spigotmc</groupId><artifactId>spigot-api</artifactId><version>26.1-R0.1-SNAPSHOT</version></dependency></dependencies></project>
          POM
          mvn -q -B dependency:copy-dependencies -DoutputDirectory=lib 2>&1 | tail -3
          CP=$(ls lib/*.jar | tr '\n' ':')
          { echo "#### Server\$Spigot full"; javap -public -cp "$CP" 'org.bukkit.Server$Spigot'; echo "#### LivingEntity"; javap -public -cp "$CP" org.bukkit.entity.LivingEntity | grep -E "isGliding|isSwimming|isClimbing|isInWater|getActivePotionEffects|getPotionEffect|hasPotionEffect|isRiptiding|getEyeLocation|getMaximumNoDamageTicks|getLastDamage"; echo "#### HumanEntity"; javap -public -cp "$CP" org.bukkit.entity.HumanEntity | grep -E "getGameMode|isOp|getOpenInventory"; echo "#### Entity"; javap -public -cp "$CP" org.bukkit.entity.Entity | grep -E "getUniqueId|isInWater|getLocation|getWorld|isValid|getType|isInsideVehicle"; echo "#### InventoryView"; javap -public -cp "$CP" org.bukkit.inventory.InventoryView | head -30; echo "#### PlayerVelocityEvent"; javap -public -cp "$CP" org.bukkit.event.player.PlayerVelocityEvent | head; echo "#### PlayerTeleportEvent"; javap -public -cp "$CP" org.bukkit.event.player.PlayerTeleportEvent | head -12; echo "#### PotionEffectType speed names"; javap -public -cp "$CP" org.bukkit.potion.PotionEffectType | grep -E "SPEED|JUMP_BOOST|LEVITATION|SLOW_FALLING|SLOWNESS|DOLPHINS|LEVITATION"; echo "#### Material check"; javap -public -cp "$CP" org.bukkit.Tag | grep -E "CLIMBABLE|WALL_POST|FALL_DAMAGE_RESETTING" ; echo "#### ServicesManager"; javap -public -cp "$CP" org.bukkit.plugin.ServicesManager | head -5; echo "#### Block"; javap -public -cp "$CP" org.bukkit.block.Block | grep -E "isLiquid|isPassable|isSolid|getType\("; echo "#### World getNearbyEntities / getChunk"; javap -public -cp "$CP" org.bukkit.World | grep -E "isChunkLoaded|getNearbyEntities|getBlockAt\(int"; echo "#### PlayerInventory/Inventory"; javap -public -cp "$CP" org.bukkit.event.inventory.InventoryCloseEvent | head -8; echo "#### ServerCommand "; javap -public -cp "$CP" org.bukkit.command.PluginCommand | head -12; } >> ../../out/misc.txt 2>&1
          cd ../..
          wc -c out/misc.txt
      - name: Publish probe output to branch
        run: |
          cd out && git init -q && git config user.name probe && git config user.email probe@example.com && git checkout -q -b probe-output && git add . && git commit -qm "probe output" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-output
