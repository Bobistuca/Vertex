name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in viaversion-api viabackwards; do echo "== $a"; curl -sL https://repo.viaversion.com/com/viaversion/$a/maven-metadata.xml | grep -E "<latest>|<release>"; done
          curl -sL https://repo.viaversion.com/com/viaversion/viaversion-api/maven-metadata.xml | grep -oE "<version>[^<]*" | tail -8
          echo "== jars"; for p in ViaVersion ViaBackwards; do curl -sL https://repo.viaversion.com/com/viaversion/ -o /dev/null -w "%{http_code}\n"; done
          echo "== paper 1.21 builds"; curl -sL https://fill.papermc.io/v3/projects/paper | head -c 600
          echo; echo "== spigot 1.21.x manifests"; for v in 1.21 1.21.1 1.21.3 1.21.4 1.21.5 1.21.8 1.21.10 1.21.11; do echo -n "$v: "; curl -sL https://hub.spigotmc.org/versions/$v.json | tr -d '\n\t ' | head -c 160; echo; done
