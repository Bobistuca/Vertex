name: Probe
on:
  workflow_dispatch:
  push:
    branches: [ "claude/vertex-minecraft-anticheat-5ldbyr" ]
    paths: [ ".github/workflows/probe.yml" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Resolve APIs
        run: |
          mkdir -p w && cd w
          mk() { # name repoId repoUrl dep-xml
            mkdir -p $1 && cat > $1/pom.xml <<POM
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>p</groupId><artifactId>$1</artifactId><version>1</version>
          <repositories><repository><id>r</id><url>$2</url></repository></repositories>
          <dependencies>$3</dependencies></project>
          POM
            (cd $1 && mvn -q -B dependency:copy-dependencies -DoutputDirectory=lib 2>&1 | tail -5; ls lib | head -50)
          }
          mk spigot261 https://hub.spigotmc.org/nexus/content/repositories/snapshots/ "<dependency><groupId>org.spigotmc</groupId><artifactId>spigot-api</artifactId><version>26.1-R0.1-SNAPSHOT</version></dependency>"
          mk spigot263 https://hub.spigotmc.org/nexus/content/repositories/snapshots/ "<dependency><groupId>org.spigotmc</groupId><artifactId>spigot-api</artifactId><version>26.3-R0.1-SNAPSHOT</version></dependency>"
          PV=$(curl -sSL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -oE "<version>26\.1\.2\.build[^<]*" | sed 's/<version>//' | tail -1); echo "paper 26.1.2 -> $PV"
          mk paper261 https://repo.papermc.io/repository/maven-public/ "<dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>$PV</version></dependency>"
          mkdir -p pe && cd pe && P=https://repo.codemc.io/repository/maven-releases/com/github/retrooper && curl -sSLfO $P/packetevents-spigot/2.14.0/packetevents-spigot-2.14.0.jar && curl -sSLfO $P/packetevents-api/2.14.0/packetevents-api-2.14.0.jar && curl -sSLfO $P/packetevents-netty-common/2.14.0/packetevents-netty-common-2.14.0.jar; ls
      - name: Inspect
        run: |
          set +e
          mkdir -p out
          { 
          PE=$(ls w/pe/*.jar | tr '\n' ':')
          pe() { echo "#### $1"; javap -public -cp "$PE" "$@" 2>&1 | sed 's/com.github.retrooper.packetevents.//g' | cut -c1-260 | head -${N:-70}; }
          for c in wrapper.play.client.WrapperPlayClientAttack wrapper.play.client.WrapperPlayClientPunch wrapper.play.client.WrapperPlayClientPlayerDigging 'wrapper.play.client.WrapperPlayClientPlayerDigging$Action' protocol.world.Location wrapper.common.client.WrapperCommonClientPluginMessage wrapper.play.client.WrapperPlayClientCloseWindow wrapper.play.client.WrapperPlayClientPlayerPosition wrapper.play.client.WrapperPlayClientClientTickEnd protocol.packettype.PacketTypeCommon 'wrapper.play.client.WrapperPlayClientClickWindow$WindowClickType' 'protocol.ConnectionState' protocol.player.UserProfile PacketEventsAPI; do N=70 pe com.github.retrooper.packetevents.$c; done
          echo "#### attack-ish wrappers"; unzip -Z1 w/pe/packetevents-api-2.14.0.jar | grep -iE "client/.*(Attack|Punch|Interact|Spectate)" 
          echo "#### PacketEventsAPI methods"; javap -public -cp "$PE" com.github.retrooper.packetevents.PacketEventsAPI | cut -c1-200 | grep -E "get|load|init|terminate|isLoaded|isInitialized" | sed 's/com.github.retrooper.packetevents.//g'
          echo "#### EventManager"; javap -public -cp "$PE" com.github.retrooper.packetevents.event.EventManager | sed 's/com.github.retrooper.packetevents.//g' | cut -c1-200
          } > out/pe.txt 2>&1
          for t in spigot261 spigot263 paper261; do
            CP=$(ls w/$t/lib/*.jar | tr '\n' ':'); 
            {
            echo "================ $t"; ls w/$t/lib
            j() { echo "#### $1"; javap -public -cp "$CP" "$1" | cut -c1-230 | grep -E "${2:-.}" | head -${N:-60}; }
            j net.md_5.bungee.api.chat.HoverEvent "HoverEvent\(|Action"
            j net.md_5.bungee.api.chat.TextComponent "TextComponent\(|setColor|setBold|setHoverEvent|addExtra"
            j net.md_5.bungee.api.ChatColor " of\(|getColor"
            j net.md_5.bungee.api.chat.hover.content.Text "Text\("
            j org.bukkit.Bukkit "getTPS|AverageTickTime|getTickTimes|getOperators|spigot\(|getOnlinePlayers|isPrimaryThread|getScoreboardManager|getBannedPlayers"
            j org.bukkit.Server "getTPS|AverageTickTime|getTickTimes|isPrimaryThread|getOperators|getMinecraftVersion|getBukkitVersion|getVersion\(\)"
            j 'org.bukkit.Server$Spigot' "getTPS|sendMessage"
            j org.bukkit.entity.Player "getPing|isOp|getGameMode|getClientBrandName|getScoreboardTags|spigot\(|sendActionBar|isFlying|getAllowFlight|isGliding|isSwimming|isInsideVehicle|isOnGround|getLocale|getFlySpeed|getWalkSpeed|hasPermission|getEyeLocation|isSprinting|isSneaking|getActivePotionEffects|getAttribute|getUniqueId|isClimbing|isInWater|getVelocity|isRiptiding|getInventory|getOpenInventory|getBoundingBox"
            j 'org.bukkit.entity.Player$Spigot' "sendMessage|getPing"
            j org.bukkit.entity.Entity "getScoreboardTags|getBoundingBox|getEntityId|getVelocity|getNearbyEntities|isOnGround|getVehicle|getFallDistance"
            j org.bukkit.attribute.Attribute "MOVEMENT_SPEED|INTERACTION_RANGE|JUMP_STRENGTH|GRAVITY|FLYING_SPEED|STEP_HEIGHT|SAFE_FALL|SCALE"
            j org.bukkit.GameMode "static final"
            j org.bukkit.scoreboard.Team "getPrefix|prefix|getSuffix|getName|hasEntry|getEntries|getDisplayName"
            j org.bukkit.scoreboard.Scoreboard "getEntryTeam|getTeams|getTeam"
            j org.bukkit.event.player.PlayerGameModeChangeEvent "public"
            j org.bukkit.event.server.ServerCommandEvent "public"
            j org.bukkit.event.player.PlayerCommandPreprocessEvent "public"
            j org.bukkit.event.player.PlayerRegisterChannelEvent "public"
            j org.bukkit.event.inventory.InventoryOpenEvent "public"
            j org.bukkit.event.player.PlayerQuitEvent "public"
            j org.bukkit.event.entity.EntityToggleGlideEvent "public"
            j org.bukkit.event.entity.EntityDamageByEntityEvent "public"
            j org.bukkit.scheduler.BukkitScheduler "runTask|runTaskTimer|runTaskAsynchronously|runTaskLater"
            j org.bukkit.plugin.PluginDescriptionFile "getAPIVersion|getVersion"
            j org.bukkit.command.TabExecutor "public"
            j org.bukkit.command.CommandSender "public"
            unzip -p w/$t/lib/$(ls w/$t/lib | grep -E "^(spigot|paper)-api" | head -1) plugin.yml 2>/dev/null | head -5
            echo "-- adventure native?"; unzip -Z1 w/$t/lib/$(ls w/$t/lib | grep -E "^(spigot|paper)-api" | head -1) | grep -cE "^net/kyori" 
            ls w/$t/lib | grep -iE "kyori|adventure|snakeyaml|gson|bungee" 
            } > out/$t.txt 2>&1
          done
          wc -c out/*
      - name: Publish probe output to branch
        run: |
          cd out && git init -q && git config user.name probe && git config user.email probe@example.com && git checkout -q -b probe-output && git add . && git commit -qm "probe output" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-output
