name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    env:
      VERTEX_BUILD_ID: build-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile and package
        run: ./gradlew build --no-daemon --stacktrace

      - name: Inspect the packaged jar
        run: |
          set -e
          JAR=plugin/build/libs/Vertex.jar
          ls -l "$JAR"
          echo "--- plugin.yml"; unzip -p "$JAR" plugin.yml
          echo "--- top-level packages"; unzip -Z1 "$JAR" | awk -F/ 'NF>2{print $1"/"$2"/"$3"/"$4}' | sort | uniq -c | sort -rn | head -30
          echo "--- unrelocated third-party classes (must be none)"
          if unzip -Z1 "$JAR" | grep -E '^(net/kyori|com/github/retrooper|io/github/retrooper|org/yaml)/' ; then exit 1; fi
          echo "--- required metadata and optional-integration checks"
          unzip -p "$JAR" plugin.yml | grep -q 'softdepend: \[LuckPerms\]'
          unzip -p "$JAR" plugin.yml | grep -q 'vertex.bypass.gameplay'
          unzip -p "$JAR" plugin.yml | grep -A2 'vertex.bypass.gameplay:' | grep -q 'default: false'
          if unzip -Z1 "$JAR" | grep -E '^net/luckperms/' ; then echo "LuckPerms API must not be bundled"; exit 1; fi
          unzip -Z1 "$JAR" | grep -q '^io/github/bobistuca/vertex/core/staff/ExemptionRegistry.class'
          unzip -Z1 "$JAR" | grep -q '^io/github/bobistuca/vertex/integration/LuckPermsBridge.class'
          unzip -Z1 "$JAR" | grep -q '^embedded/paper/io/github/bobistuca/vertex/paper/PaperAdapters.class.bin'
          echo "--- META-INF entries (excluding maven metadata and multi-release classes)"
          unzip -Z1 "$JAR" | grep '^META-INF/' | grep -vE '^META-INF/(maven|versions)/' | head -40 || true
          echo "--- bundled resources"; unzip -Z1 "$JAR" | grep -E '^(config.yml|lang/|assets/mappings/)' | head -8

      - name: Exercise the shaded jar (relocated Adventure/MiniMessage and SnakeYAML)
        run: |
          set -e
          mkdir -p selftest && cat > selftest/ShadedSelfTest.java <<'JAVA'
          import io.github.bobistuca.vertex.core.config.Settings;
          import io.github.bobistuca.vertex.core.config.SettingsLoader;
          import io.github.bobistuca.vertex.core.i18n.Rich;
          import io.github.bobistuca.vertex.core.i18n.RichRenderer;
          import java.util.Map;

          public class ShadedSelfTest {
              public static void main(String[] args) {
                  Settings s = SettingsLoader.defaults();
                  Rich r = new RichRenderer(s.appearance()).render(
                          "<primary><bold>[Vertex]</bold></primary> <text><name></text>", Map.of("name", "<red>Evil"));
                  String plain = r.toPlainText();
                  if (!plain.equals("[Vertex] <red>Evil")) throw new IllegalStateException("unexpected: " + plain);
                  System.out.println("shaded jar renders: " + plain);
              }
          }
          JAVA
          javac -cp plugin/build/libs/Vertex.jar -d selftest selftest/ShadedSelfTest.java
          java -cp plugin/build/libs/Vertex.jar:selftest ShadedSelfTest

      - name: Upload Vertex.jar
        uses: actions/upload-artifact@v4
        with:
          name: Vertex
          path: plugin/build/libs/Vertex.jar
          if-no-files-found: error
